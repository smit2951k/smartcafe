<!-- Reusable Editorial Section Header -->
<div class="reveal {% if is_dark %}section-dark{% endif %}" style="text-align: {{ alignment|default('left') }}; margin-bottom: clamp(36px, 5vw, 64px); max-width: {% if alignment == 'center' %}760px{% else %}680px{% endif %}; {% if alignment == 'center' %}margin-left: auto; margin-right: auto;{% endif %}">
  {% if eyebrow %}
  <span class="eyebrow" style="margin-bottom: 12px;">{{ eyebrow }}</span>
  {% endif %}
  <h2 style="font-size: clamp(2.2rem, 4.5vw, 3.4rem); margin-bottom: 14px; font-weight: 400; line-height: 1.15;">
    {{ title }}
  </h2>
  {% if subtitle %}
  <p class="lead" style="margin: 0; font-size: var(--text-base);">
    {{ subtitle }}
  </p>
  {% endif %}
</div>

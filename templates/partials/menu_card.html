<!-- Reusable Boutique Menu Card -->
<div class="card-clean reveal" style="display: flex; flex-direction: column; justify-content: space-between; height: 100%;">
  <div>
    <!-- Food Image -->
    <a href="/menu/{{ item.id }}" class="img-zoom-wrap" style="display: block; aspect-ratio: 4/3; margin-bottom: 20px;">
      <img
        src="{{ item.image }}"
        alt="{{ item.name }}"
        loading="lazy"
        onerror="this.onerror=null; this.src='https://images.unsplash.com/photo-1510591509098-f4fdc6d0ff04?auto=format&fit=crop&w=800&q=80';"
      />
      {% if item.is_featured %}
      <span style="position: absolute; top: 12px; left: 12px; background-color: var(--color-espresso); color: var(--color-cream); font-size: 10px; font-weight: 700; letter-spacing: var(--tracking-wider); text-transform: uppercase; padding: 4px 10px; border-radius: var(--radius-full);">
        Signature
      </span>
      {% endif %}
    </a>

    <!-- Category & Title -->
    <div style="display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 6px;">
      <span style="font-size: var(--text-xs); text-transform: uppercase; letter-spacing: var(--tracking-wider); color: var(--color-accent-bronze); font-weight: 600;">
        {{ item.category }}
      </span>
      <span style="font-family: var(--font-serif); font-size: 1.15rem; font-weight: 500; color: var(--color-text-primary);">
        ₹{{ item.price }}
      </span>
    </div>

    <h3 style="font-size: 1.35rem; font-weight: 400; margin-bottom: 8px;">
      <a href="/menu/{{ item.id }}" class="link-underline" style="color: inherit;">
        {{ item.name }}
      </a>
    </h3>

    <p style="font-size: var(--text-sm); color: var(--color-text-secondary); line-height: 1.55; margin-bottom: 20px;">
      {{ item.description[:110] }}{% if item.description|length > 110 %}...{% endif %}
    </p>
  </div>

  <!-- Action Bar -->
  <div style="display: flex; justify-content: space-between; align-items: center; border-top: 1px solid var(--color-border); padding-top: 16px;">
    <a href="/menu/{{ item.id }}" style="font-size: var(--text-xs); text-transform: uppercase; letter-spacing: var(--tracking-wider); font-weight: 600; color: var(--color-text-secondary);" class="link-underline">
      Details
    </a>

    <button
      type="button"
      onclick="addSimpleItemToCart('{{ item.id }}', {{ item.name|tojson }}, {{ item.price }}, '{{ item.image }}', '{{ item.category }}', this, event)"
      class="btn-pill btn-pill-primary btn-pill-sm add-tray-btn"
      aria-label="Add {{ item.name }} to Tray"
    >
      <span>+ Tray</span>
    </button>
  </div>
</div>
